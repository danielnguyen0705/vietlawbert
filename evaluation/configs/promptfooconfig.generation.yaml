# Tier 5 — Tạo sinh có căn cứ & An toàn (Faithfulness, Citation, Guardrail). Đề cương §VI.
# Chạy:  npx promptfoo eval -c evaluation/configs/promptfooconfig.generation.yaml
description: "VietLawBERT Tier-5 Grounded Generation & Safety (RQ4)"
providers:
  - id: "python:tests/_common/providers/generation_provider.py"
    label: "vietlawbert-rag"
    config: { mode: "hybrid", top_k: 5 }
tests: file://../datasets/promptfoo_generation_tests.yaml
defaultTest:
  assert:
    - type: javascript        # Citation Precision: câu trả lời PHẢI trích số hiệu văn bản
      value: |
        const out = typeof output === 'string' ? output : JSON.stringify(output);
        return /\d+\/\d{4}\/[A-ZĐ\-]+/.test(out) ? 1 : 0;
    # Faithfulness (LLM-as-Judge/RAGAS) — bật khi cấu hình provider grader có API key:
    # - type: llm-rubric
    #   value: "Câu trả lời CHỈ dùng thông tin trong căn cứ truy xuất, tuyệt đối không bịa."
