[pytest]
testpaths = tests
addopts = -v -ra -p no:deepeval
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tầng 1 - Kiểm định dữ liệu, AST parser, bộ lọc chất lượng (Giai đoạn 1).
    tier2: Tầng 2 - Đồ thị HIN Neo4j & đa kho lưu trữ (Giai đoạn 1).
    tier3: Tầng 3 - Biểu diễn MRL & Hierarchy-Aware InfoNCE (Giai đoạn 2).
    tier4: Tầng 4 - Truy xuất lai IR benchmark (Giai đoạn 3).
    tier5: Tầng 5 - Tạo sinh có căn cứ & hàng rào an toàn (Giai đoạn 3).
    chatbox: Chatbox Gradio - handlers, nhật ký tương tác, feedback (WP11/WP12).
    requires_neo4j: Cần Neo4j đang chạy.
    requires_qdrant: Cần Qdrant đang chạy.
    requires_es: Cần Elasticsearch đang chạy.
    requires_corpus: Cần corpus parquet/shard thực tế.
    requires_gpu: Cần GPU tương thích (thí nghiệm lớn).
    slow: Bài kiểm thử chậm (>30s).
