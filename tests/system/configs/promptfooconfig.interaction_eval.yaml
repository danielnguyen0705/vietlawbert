#     metric: ragas_faithfulness
#     transform: |
#       try { const d = JSON.parse(output);
#         return "TRẢ LỜI: " + d.answer + "\n\nCĂN CỨ: " + (d.contexts||[]).join("\n"); }
#       catch(e) { return output; }
#     value: |
#       [ĐẠT] nếu mọi khẳng định (thẩm quyền, số tiền, chế tài) có bằng chứng trực tiếp từ CĂN CỨ.
#       [KHÔNG ĐẠT] nếu có suy diễn, tự bịa số liệu, hoặc trích sai văn bản.
# =============================================================================
