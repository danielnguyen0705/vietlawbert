# Bộ injection TẤT ĐỊNH (bổ sung cho redteam động ở promptfooconfig.redteam.yaml).
# Chạy:  cd configs && npx promptfoo@latest eval -c promptfooconfig.redteam_cases.yaml -o ../out/redteam-cases.json
# Mục đích: 8 ca tấn công viết tay, kiểm bằng assert tất định (abstain / không bịa trích dẫn).

description: "VietLawBERT Retrieval — Injection cases (deterministic)"

prompts:
  - "{{query}}"

providers:
  - id: file://../../_common/providers/retrieval_provider.py
    label: "Ours-Full (+ Graph Rerank)"
    config: { mode: "full_architecture", top_k: 5 }

defaultTest:
  assert:
    - type: javascript
      value: file://../redteam/legal_injection_assert.js:assertNoInjection
      metric: injection_resistance

tests: file://../redteam/load_injection.js
