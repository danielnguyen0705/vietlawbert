# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# RQ3 — Ablation truy xuất lai (metric TẤT ĐỊNH, latency tách riêng)
# Chạy:   cd configs && VLB_LIMIT=150 npx promptfoo@latest eval -c promptfooconfig.rq3_retrieval.yaml -o ../out/eval-rq3.json
#         npx promptfoo@latest view
#         python3 ../tools/analyze_latency.py --eval ../out/eval-rq3.json
#
# Thay cho promptfooconfig.retrieval.yaml cũ:
#   - BỎ legal_relevance_judge (LLM-rubric) — không tất định, phụ thuộc endpoint.
#   - BỎ latency_sla_500ms (vốn <60000ms, luôn PASS → che tính đúng). Latency -> latency_report non-gating.
#   - chunk_hit exact -> doc_hit@k (contain-any) + article_hit@k / clause_hit@k (equal theo global-ID).

description: "RQ3 Retrieval Ablation — deterministic metrics"

prompts:
  - "{{query}}"

evaluateOptions:
  maxConcurrency: 1
  timeoutMs: 600000      # 10 phút/worker — tránh timeout khi nạp cache đồ thị trên CPU

providers:
  - id: "file://../providers/retrieval_provider.py"
    label: "Dense-Only (VietLawBERT @ 256d)"
    config: { mode: "dense_only", top_k: 5, timeoutMs: 600000 }
  - id: "file://../providers/retrieval_provider.py"
    label: "Sparse-Only (BM25)"
    config: { mode: "sparse_only", top_k: 5, timeoutMs: 600000 }
  - id: "file://../providers/retrieval_provider.py"
    label: "Hybrid-RRF (Dense 256d + BM25)"
    config: { mode: "hybrid_rrf", top_k: 5, timeoutMs: 600000 }
  - id: "file://../providers/retrieval_provider.py"
    label: "Ours-Full Architecture (+ Graph Rerank)"
    config: { mode: "full_architecture", top_k: 5, timeoutMs: 600000 }

defaultTest:
  assert:
    - type: javascript
      value: file://../assertions/retrieval_metrics.js:docHitAtK
      metric: doc_hit@k
    - type: javascript
      value: file://../assertions/retrieval_metrics.js:articleHitAtK
      metric: article_hit@k
    - type: javascript
      value: file://../assertions/retrieval_metrics.js:clauseHitAtK
      metric: clause_hit@k
    - type: javascript
      value: file://../assertions/retrieval_metrics.js:latencyReport
      metric: latency_report
      weight: 0
    - type: javascript
      value: file://../assertions/fail_category.js:classify
      metric: fail_category
      weight: 0

tests: file://../datasets/load_tests.js
