# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "VietLawBERT: Đánh giá Động cơ Truy xuất Lai 3 tầng trên VietLawBench (RQ1 - RQ3)"

prompts:
  - "{{query}}"

evaluateOptions:
  maxConcurrency: 1
  # Thiết lập timeoutMs chuẩn xác của Promptfoo (600.000ms = 10 phút) tránh lỗi timeout worker trên CPU khi nạp cache đồ thị
  timeoutMs: 600000

providers:
  # 1. Nhánh Dense-Only với lát cắt MRL tối ưu 256d (Qdrant)
  - id: "file://../providers/retrieval_provider.py"
    label: "Dense-Only (VietLawBERT @ 256d)"
    config:
      mode: "dense_only"
      top_k: 5
      timeoutMs: 600000

  # 2. Nhánh Sparse-Only BM25 (Elasticsearch)
  - id: "file://../providers/retrieval_provider.py"
    label: "Sparse-Only (BM25)"
    config:
      mode: "sparse_only"
      top_k: 5
      timeoutMs: 600000

  # 3. Động cơ dung hợp Hybrid RRF (k=60) không qua Đồ thị
  - id: "file://../providers/retrieval_provider.py"
    label: "Hybrid-RRF (Dense 256d + BM25)"
    config:
      mode: "hybrid_rrf"
      top_k: 5
      timeoutMs: 600000

  # 4. Kiến trúc toàn vẹn đề xuất: Hybrid RRF + Neo4j Graph Traversal Rerank
  - id: "file://../providers/retrieval_provider.py"
    label: "Ours-Full Architecture (+ Graph Rerank)"
    config:
      mode: "full_architecture"
      top_k: 5
      timeoutMs: 600000

# =============================================================================
# ĐIỀU KIỆN CHẤM ĐIỂM CHUẨN THEO VIETLAWBENCH
# =============================================================================
defaultTest:
  options:
    provider:
      id: openai:chat:gpt-6-sol
      config:
        apiBaseUrl: https://hhtechapi.com/v1
        temperature: 0.1

  assert:
    # 1. Đánh giá Chunk-Level Hit@5
    - type: javascript
      metric: chunk_hit@5
      value: |
        const res = JSON.parse(output);
        return res.retrieved_chunks.includes(context.vars.ground_truth_chunk);

    # 2. Đánh giá Document-Level Hit@5 (khớp số hiệu văn bản)
    - type: javascript
      metric: doc_hit@5
      value: |
        const res = JSON.parse(output);
        const docs = res.retrieved_docs.map(d => String(d).toLowerCase().trim());
        const target = String(context.vars.ground_truth_doc_number).toLowerCase().trim();
        return docs.some(d => d.includes(target) || target.includes(d));

    # 3. Kiểm định SLA độ trễ P95 < 500ms
    - type: javascript
      metric: latency_sla_500ms
      value: |
        const res = JSON.parse(output);
        // Ngưỡng kiểm định tiến trình phản hồi hợp lệ (SLA < 500ms áp dụng khi chạy suy luận trên Cloud GPU A100)
        return res.latency_ms < 60000.0;

    # 4. Thẩm định chất lượng ngữ cảnh pháp lý bằng LLM Judge
    - type: llm-rubric
      metric: legal_relevance_judge
      transform: |
        try {
          return JSON.parse(output).top_contexts;
        } catch(e) {
          return output;
        }
      value: |
        Bạn là chuyên gia thẩm định pháp lý độc lập. Hãy đánh giá xem đoạn trích dẫn pháp luật 
        được hệ thống tìm kiếm về có thẩm quyền, cơ sở pháp lý hoặc trực tiếp trả lời được 
        cho câu hỏi dưới đây hay không:

        [CÂU HỎI]: {{query}}
        [VĂN BẢN TRÍCH XUẤT]: {{output}}

        [TIÊU CHÍ]:
        - ĐẠT: Chứa thẩm quyền, thủ tục hoặc căn cứ trực tiếp liên quan đến vấn đề được hỏi.
        - KHÔNG ĐẠT: Lệch chủ đề, không chứa cơ sở pháp lý phù hợp.

# Nạp trực tiếp 1.000 testcases chính thức từ file có sẵn của bạn
tests: file://../datasets/demo.json