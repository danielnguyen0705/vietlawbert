services:
  # ==========================================
  # 1. BỘ NÃO XỬ LÝ (CHỈ BUILD KHI CẦN CONTAINER HÓA HOÀN TOÀN)
  # ==========================================
  app:
    profiles: ["manual"]
    build: .
    container_name: vietlawbert_container
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - MONGO_URI=mongodb://db:27017/
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - KAFKA_BROKER=redpanda:29092
    networks:
      - vietlaw_net

  consumer:
    profiles: ["manual"]
    build: .
    container_name: vietlawbert_consumer
    command: ["python", "-m", "cli.consume_embeddings", "--idle-exit-seconds", "15"]
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - vietlaw_net

  # ==========================================
  # 2. HẠ TẦNG CƠ SỞ DỮ LIỆU CỐT LÕI (CORE DATABASES)
  # ==========================================
  db:
    image: mongo:7.0
    container_name: mongodb_vietlaw
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vietlaw_mongo_data:/data/db
    networks:
      - vietlaw_net

  neo4j:
    image: neo4j:5.18.1
    container_name: neo4j_vietlaw
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/vietlawbert
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
    networks:
      - vietlaw_net

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus_etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - vietlaw_net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - vietlaw_net

  milvus-standalone:
    image: milvusdb/milvus:v2.4.5
    container_name: milvus_vietlaw
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - vietlaw_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.28
    container_name: redpanda_vietlaw
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - vietlaw_net

volumes:
  vietlaw_mongo_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
  redpanda_data:

networks:
  vietlaw_net:
    driver: bridge
