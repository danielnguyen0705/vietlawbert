services:
  # vllm: Đã loại bỏ khỏi Docker do GTX 1050 Ti (Pascal) không tương thích.
  # LLM sẽ chạy trực tiếp trên host Ubuntu qua Ollama (http://localhost:11434/v1)

  # ==========================================
  # 1. BỘ NÃO XỬ LÝ & DỮ LIỆU THÔ (CORE)
  # ==========================================
  app:
    build: .
    container_name: vietlawbert_container
    volumes:
      - .:/app
    working_dir: /app/law_dataset
    environment:
      - MONGO_URI=mongodb://db:27017/
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      # LLM chạy trực tiếp trên host Ubuntu (Ollama)
      - LLM_API_BASE=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - CONTEXTUALIZER_MODEL=qwen2.5:1.5b
      - GENERATOR_MODEL=qwen2.5:1.5b
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_GROUP_ID=vietlawbert-consumers-v5-bounded
      - KAFKA_TOPIC=law-documents-v5
      - OCR_ENABLED=1
      - OCR_INLINE_ENABLED=1
      - OCR_LANG=vie+eng
      - OCR_DPI=200
      - OCR_MAX_PAGES=200
      - OCR_CONCURRENCY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      neo4j:
        condition: service_started
      milvus-standalone:
        condition: service_started
    stdin_open: true
    tty: true
    networks:
      - vietlaw_net

  # Consumer ingestion chạy độc lập, có thể auto-restart và theo dõi log riêng.
  # Khởi động: docker compose --profile ingestion up -d consumer
  consumer:
    profiles: ["ingestion"]
    build: .
    container_name: vietlawbert_consumer
    command: ["python", "src/streaming/consumer.py"]
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app/law_dataset
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_GROUP_ID=vietlawbert-consumers-v5-bounded
      - KAFKA_TOPIC=law-documents-v5
      - CONSUMER_DOC_BATCH_SIZE=10
      - CONSUMER_CHUNK_BATCH_SIZE=64
      - CONSUMER_FLUSH_INTERVAL_SECONDS=5
      - EMBED_DEVICE=auto
      - EMBED_BATCH_SIZE=16
      - EMBED_CPU_INT8=1
    depends_on:
      neo4j:
        condition: service_started
      milvus-standalone:
        condition: service_started
      redpanda:
        condition: service_started
    networks:
      - vietlaw_net

  db:
    image: mongo:latest
    container_name: mongodb_vietlaw
    ports:
      - "27017:27017"
    volumes:
      - vietlaw_data:/data/db
    networks:
      - vietlaw_net

  # ==========================================
  # 2. HẠ TẦNG HYBRID RAG (GRAPH & VECTOR)
  # ==========================================
  neo4j:
    image: neo4j:5.18.1
    container_name: neo4j_vietlaw
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/vietlawbert
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
    networks:
      - vietlaw_net

  # --- Cụm hệ sinh thái Milvus ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - vietlaw_net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.5
    container_name: milvus_vietlaw
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - vietlaw_net

  # ==========================================
  # 3. KAFKA MESSAGE BROKER (EVENT-DRIVEN BIG DATA)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.28
    container_name: redpanda_vietlaw
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - vietlaw_net

volumes:
  vietlaw_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
  redpanda_data:

networks:
  vietlaw_net:
    driver: bridge
