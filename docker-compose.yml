services:
  # ==========================================
  # 1. BỘ NÃO XỬ LÝ & DỮ LIỆU THÔ (CORE)
  # ==========================================
  app:
    build: .
    container_name: vietlawbert_container
    volumes:
      - .:/app
      - shared_data:/mnt/data/vietlawbert_data
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATA_STORAGE_ROOT=/mnt/data/vietlawbert_data
      - MONGO_URI=mongodb://db:27017/
      - MONGO_DB_NAME=vietlawbert_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION_NAME=vietlawbert_chunks
      - LLM_API_BASE=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - CONTEXTUALIZER_MODEL=qwen2.5:1.5b
      - GENERATOR_MODEL=qwen2.5:1.5b
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_GROUP_ID=vietlawbert-consumers-v5-bounded
      - KAFKA_TOPIC=law-documents-v5
      - OCR_ENABLED=1
      - OCR_INLINE_ENABLED=1
      - OCR_LANG=vie+eng
      - OCR_DPI=200
      - OCR_MAX_PAGES=200
      - OCR_CONCURRENCY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - vietlaw_net

  # Consumer Stream Processing nạp dữ liệu phân tán
  consumer:
    profiles: ["ingestion"]
    build: .
    container_name: vietlawbert_consumer
    command: ["python", "-m", "cli.consume_embeddings", "--idle-exit-seconds", "15"]
    restart: unless-stopped
    volumes:
      - .:/app
      - shared_data:/mnt/data/vietlawbert_data
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATA_STORAGE_ROOT=/mnt/data/vietlawbert_data
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION_NAME=vietlawbert_chunks
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_GROUP_ID=vietlawbert-consumers-v5-bounded
      - KAFKA_TOPIC=law-documents-v5
      - CONSUMER_DOC_BATCH_SIZE=10
      - CONSUMER_CHUNK_BATCH_SIZE=64
      - CONSUMER_FLUSH_INTERVAL_SECONDS=5
      - EMBED_DEVICE=cpu
      - EMBED_BATCH_SIZE=16
      - EMBED_CPU_INT8=1
    depends_on:
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - vietlaw_net

  # Document Store lưu trữ toàn văn bản pháp luật
  db:
    image: mongo:7.0
    container_name: mongodb_vietlaw
    ports:
      - "27017:27017"
    volumes:
      - vietlaw_mongo_data:/data/db
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. HẠ TẦNG HYBRID RAG (GRAPH & VECTOR)
  # ==========================================
  neo4j:
    image: neo4j:5.18.1
    container_name: neo4j_vietlaw
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/vietlawbert
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "vietlawbert", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  milvus-standalone:
    image: milvusdb/milvus:v2.4.5
    container_name: milvus_vietlaw
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # 3. KAFKA MESSAGE BROKER (EVENT-DRIVEN BIG DATA)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.28
    container_name: redpanda_vietlaw
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - vietlaw_net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  vietlaw_mongo_data:
  neo4j_data:
  etcd_data:
  minio_data:
  milvus_data:
  redpanda_data:
  shared_data:

networks:
  vietlaw_net:
    driver: bridge