services:
  # ============================================================================
  # 1. BỘ NÃO XỬ LÝ & PIPELINE WORKER (OFFLINE / MANUAL RUNNER)
  # ============================================================================
  app:
    profiles: ["manual"]
    build: .
    container_name: vietlawbert_app
    volumes:
      - .:/app
      - /mnt/data/vietlawbert_data:/mnt/data/vietlawbert_data
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - MONGO_URI=mongodb://db:27017/
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vietlawbert2026
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ES_HOST=http://elasticsearch:9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - qdrant
      - elasticsearch
      - neo4j
      - redis
    networks:
      - vietlaw_net

  # ============================================================================
  # 2. HẠ TẦNG CƠ SỞ DỮ LIỆU LAI (HYBRID STORAGE STACK)
  # ============================================================================

  # Document Store: Lưu trữ toàn văn và siêu dữ liệu NoSQL
  db:
    image: mongo:7.0
    container_name: mongodb_vietlaw
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vietlaw_mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - vietlaw_net

  # Dense Vector Store: MRL d=256 & Khóa trần File Descriptors chống lỗi Too Many Open Files
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: qdrant_vietlaw
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - vietlaw_net

  # Sparse Lexical Search: Elasticsearch 8.x với Vietnamese Legal Analyzer
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch_vietlaw
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data:z
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - vietlaw_net

  # Heterogeneous Information Network (HIN): Quản lý 22 quan hệ pháp lý
  neo4j:
    image: neo4j:5.18.1
    container_name: neo4j_vietlaw
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/vietlawbert2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1024m
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data:z
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - vietlaw_net

  # In-Memory Graph Cache: Lưu trữ đồ thị Node2Vec 128d (SLA < 500ms)
  redis:
    image: redis:7.2-alpine
    container_name: redis_vietlaw
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:z
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vietlaw_net

volumes:
  vietlaw_mongo_data:
  qdrant_data:
  es_data:
  neo4j_data:
  redis_data:

networks:
  vietlaw_net:
    driver: bridge